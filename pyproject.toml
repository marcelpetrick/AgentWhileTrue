[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-while-true"
description = "Agent budget watch and babysitter for Codex and Claude Code sessions in KDE Konsole."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Petrick", email = "mail@marcelpetrick.it" }]
keywords = ["konsole", "kde", "claude-code", "codex", "rate-limit", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dynamic = ["version"]
# Deliberately empty: the runtime uses only the standard library, so the tool
# stays installable on a rolling-release distro without a dependency to break.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.7", "build==1.6.1",
    "reuse==6.2.0", "pip-audit==2.10.1",
    "spdx-tools==0.8.5", "cyclonedx-python-lib[validation]==11.12.0",
]

[project.scripts]
agent-while-true = "agent_watch.cli:main"
agent-watch = "agent_watch.cli:main"

[project.urls]
Homepage = "https://github.com/marcelpetrick/AgentWhileTrue"
Source = "https://github.com/marcelpetrick/AgentWhileTrue"
Issues = "https://github.com/marcelpetrick/AgentWhileTrue/issues"

[tool.setuptools.dynamic]
version = { attr = "agent_watch.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_watch = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# src-layout: import the package under test without needing an editable install.
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = ["konsole: requires a live KDE Konsole D-Bus session"]

[tool.coverage.run]
branch = true
source = ["agent_watch"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "PTH", "RUF"]
ignore = [
    # The resume gate reads as a deliberate list of named preconditions;
    # collapsing its branches would hide the safety argument.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The simulated screens transcribe real terminal output; its prompt glyphs are
# "ambiguous" to ruff but are exactly what the CLIs print, and normalising them
# would make the scenarios prove something other than what they claim.
"src/agent_watch/simulate.py" = ["RUF001"]
# The screen fixtures transcribe real terminal output. Its box-drawing and
# prompt glyphs are "ambiguous" to ruff but are exactly what the CLIs print, and
# normalising them would make the recognizer tests test the wrong thing.
"tests/screens.py" = ["RUF001", "E501"]
"tests/test_providers.py" = ["RUF001"]
"tests/test_policy.py" = ["RUF001"]
