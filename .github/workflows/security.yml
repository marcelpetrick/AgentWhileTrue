name: Dependency audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and build/development tooling
        run: |
          python -m venv .audit-venv
          # ensurepip can seed an older installer than the runner's global pip.
          .audit-venv/bin/python -m pip install --upgrade pip==26.2.1
          .audit-venv/bin/python -m pip install '.[dev]' setuptools==84.0.0
      - name: Audit installed dependency graph
        run: .audit-venv/bin/python -m pip_audit --progress-spinner off --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
