name: Dependency audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install project and build/development tooling
        run: |
          python -m venv .audit-venv
          # ensurepip can seed an older installer than the runner's global pip.
          .audit-venv/bin/python -m pip install --upgrade pip==26.2.1
          .audit-venv/bin/python -m pip install '.[dev]' setuptools==84.0.0
      - name: Audit installed dependency graph
        run: .audit-venv/bin/python -m pip_audit --progress-spinner off --format json --output dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
