name: Release

on:
  push:
    tags:
      - "agentwhiletrue-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify release tag
        run: |
          set -euo pipefail
          project_version="$(PYTHONPATH=src python -c 'from agent_watch.version import __version__; print(__version__)')"
          tag_version="${GITHUB_REF_NAME#agentwhiletrue-v}"
          test "$tag_version" = "$project_version"
          grep -Fq "## [${project_version}]" CHANGELOG.md
      - name: Install quality tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          python -m pip install --disable-pip-version-check '.[dev]'
      - name: Run canonical local pipeline
        run: ./localPipeline.sh --noRun
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
